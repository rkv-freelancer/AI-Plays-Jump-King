experiment:
  name: "online_learning"
  seed: 42
  tracking_enabled: true

optimization:
  optimizer: "adamw"
  learning_rate: 0.001
  weight_decay: 0.0001
  momentum: 0.9

training: n_episodes = 100_000
  start_epsilon = 1.0
  epsilon_decay = start_epsilon / (n_episodes / 2)
  final_epsilon = 0.1

lr_scheduler:
  type: "cosine_annealing"
  t_max: 50
  eta_min: 0.00001
