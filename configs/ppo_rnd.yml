# PPO + RND hyperparameters for Jump King
# Edit this file to change experiment settings without touching algorithm code.
# batch_size, minibatch_size, and num_iterations are computed at runtime — do not set here.

# Calculations:
# batch_size = num_envs × num_steps
# num_updates = total_timesteps ÷ batch_size

# ── Experiment ────────────────────────────────────────────────────────────────
seed: 42
torch_deterministic: true

# ── Hardware ──────────────────────────────────────────────────────────────────
# Device auto-selects MPS on Apple Silicon; cuda flag reserved for Modal/GPU cloud
cuda: true

# ── Tracking ──────────────────────────────────────────────────────────────────
track: true
wandb_project_name: jump_king_ppo_rnd
wandb_entity: null

# ── Training loop ─────────────────────────────────────────────────────────────
total_timesteps: 100000
learning_rate: 1.0e-4
num_envs: 1
num_steps: 128
anneal_lr: true

# ── PPO ───────────────────────────────────────────────────────────────────────
# extrinsic reward discount
gamma: 0.999

# GAE smoothing
gae_lambda: 0.95

num_minibatches: 4
update_epochs: 4
norm_adv: true

# policy ratio stays in [0.9, 1.1]
clip_coef: 0.1

clip_vloss: true

# entropy bonus weight
ent_coef: 0.001

# value loss weight
vf_coef: 0.5

max_grad_norm: 0.5

# set a float (e.g. 0.01) to enable early stopping
target_kl: null

# ── RND ───────────────────────────────────────────────────────────────────────
# fraction of mini-batch that trains the RND predictor
update_proportion: 0.25
# intrinsic advantage weight
int_coef: 1.0
# extrinsic advantage weight
ext_coef: 2.0
# intrinsic reward discount
int_gamma: 0.99
# random rollouts before training starts
num_iterations_obs_norm_init: 10

# ── Checkpointing ─────────────────────────────────────────────────────────────
# save a checkpoint every N policy updates
save_interval: 50

# ── Video ─────────────────────────────────────────────────────────────
# videos_upload = num_updates ÷ video_record_interval
# video_duration = (frames captured) ÷ video_fps
video_record_interval: 25

capture_video: true
