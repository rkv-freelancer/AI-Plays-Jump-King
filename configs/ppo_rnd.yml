# PPO + RND hyperparameters for Jump King
# Edit this file to change experiment settings without touching algorithm code.
# batch_size, minibatch_size, and num_iterations are computed at runtime — do not set here.

# Calculations:
# batch_size = num_envs × num_steps
# num_updates = total_timesteps ÷ batch_size

# 500k timesteps, vectorised N=16, video-rich for visual diagnosis
# Wall-clock target: ~40-60 min on T4, ~$1 cost

total_timesteps: 500_000
num_envs: 16 # 16 parallel agents in one browser
num_steps: 64 # → batch_size = 1024, num_updates = 488
num_minibatches: 4 # → minibatch_size = 256
update_epochs: 4

learning_rate: 3.0e-4 # higher than 1e-4: 488 updates need to move the policy
anneal_lr: true

# γ MUST equal env.DEFAULT_GAMMA — invariance check
gamma: 0.999
gae_lambda: 0.95
int_gamma: 0.999 # match extrinsic (was 0.99 — be consistent if you want)

clip_coef: 0.1
clip_vloss: true
ent_coef: 0.01 # 10× the dataclass default → combat entropy collapse
vf_coef: 0.5
max_grad_norm: 0.5
target_kl: null
norm_adv: true

int_coef: 1.0
ext_coef: 2.0 # slightly down from 2.5; ext stream still un-normalised
update_proportion: 0.25
num_iterations_obs_norm_init: 10

# ── Checkpoints & videos ─────────────────────────────────────────────
save_interval: 50 # ~10 checkpoints over the run
capture_video: true
video_record_interval: 10 # ~48 videos uploaded — denser than default for visual debug
video_fps: 30
video_folder: "models/PPO/video"

# ── Tracking / logging ───────────────────────────────────────────────
track: true
log_level: "INFO"

seed: 42
torch_deterministic: true
cuda: true
