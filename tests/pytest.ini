[pytest]
# Tests live under tests/. Discovery picks up files starting with test_.
testpaths = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Custom markers — declared so pytest doesn't warn about unknown ones.
markers =
    browser: tests that spin up a real Chromium driver via Selenium.
             Skipped by default. Run with: pytest -m browser
             (or via tests/main.py --browser)

# Sensible defaults:
#   -v        : show each test name
#   -ra       : summary of skipped/xfailed at the end
#   --strict-markers : fail on unknown markers (catches typos)
#   -m "not browser" : exclude browser tests by default
addopts = -v -ra --strict-markers -m "not browser"
